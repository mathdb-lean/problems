# The Lean project every problem compiles against. formal-conjectures is required
# unmodified; Lean and Mathlib are the ones it pins. MathDBLib holds definitions that are
# MathDB's own; everything else a statement needs comes from Mathlib or formal-conjectures.
#
# The problem folders are deliberately not a `lean_lib`: a grader elaborates each module
# on its own against this project, and `lake build` never builds the statements.

name = "mathdb_problems"
defaultTargets = ["MathDBLib"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures"
rev = "e04cc601840dd7a37f89b821a67f3a9e3c38d9c3"

[[lean_lib]]
name = "MathDBLib"
