# This repository root is a *built Lean project* that a grader can point
# `project_dir` at. It carries the vendored statement-support libraries that every
# problem module imports. `srcDir = "."` because the libraries sit beside this
# file.
#
# The problem modules under `problems/` are deliberately NOT a `lean_lib` here.
# They are the benchmark: a grader elaborates each one against this project, one at
# a time, in isolation. Neither library's glob reaches them -- each is rooted at its
# own name -- so `lake build` builds the project and never the benchmark, and that
# is the property to preserve. Do not add a `lean_lib` named `FtpEvalBench`,
# `FtpEvalGoal` or `Submission`: a grader that generates a module under one of those
# roots refuses when a project library collides with it.

name = "mathdb_lean"
keywords = ["math", "benchmark"]
defaultTargets = ["MathDBUtil", "MathDBMathlib"]

[leanOptions]
# Carried over from formal-conjectures: the vendored libraries were written
# under these options and do not build cleanly without them.
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "MathDBMathlib"
srcDir = "."

[[lean_lib]]
name = "MathDBUtil"
srcDir = "."
globs = ["MathDBUtil.*"]
