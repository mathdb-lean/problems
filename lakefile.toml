# This repository root is a *built Lean project* that a grader can point
# `project_dir` at. It carries the vendored statement-support libraries that every
# problem module imports. `srcDir = "."` because the libraries sit beside this
# file.
#
# The problem modules under `problems/` are deliberately NOT a `lean_lib` here.
# They are the benchmark: a grader elaborates each one against this project, one at
# a time, in isolation. Neither library's glob reaches them -- each is rooted at its
# own name -- so `lake build` builds the project and never the benchmark, and that
# is the property to preserve. Do not add a `lean_lib` named `FtpEvalBench`,
# `FtpEvalGoal` or `Submission`: a grader that generates a module under one of those
# roots refuses when a project library collides with it.

name = "mathdb_lean"
keywords = ["math", "benchmark"]
defaultTargets = ["MathDBUtil", "MathDBMathlib"]

[leanOptions]
# Carried over from formal-conjectures: the vendored libraries were written
# under these options and do not build cleanly without them.
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "MathDBMathlib"
srcDir = "."

[[lean_lib]]
name = "MathDBUtil"
srcDir = "."
globs = ["MathDBUtil.*"]

# Upstream's complete statement corpus, mirrored under `FormalConjectures/` with
# its imports pointed at `MathDBUtil`. It is a library so that it can be built --
# a mirror nobody can compile is a directory of text -- and deliberately NOT in
# `defaultTargets`, because `lake build` is what a grader runs and it has no
# reason to elaborate 1416 upstream statements first. Build it on purpose:
#
#     lake build FormalConjectures
#
# `globs` uses `.+`, submodules only, matching upstream: there is no
# `FormalConjectures.lean` root module and adding one would be our invention.
# The two `weak.linter` options are upstream's own, for linters that live in the
# support library; `weak` means they are ignored where the option is absent.
[[lean_lib]]
name = "FormalConjectures"
srcDir = "."
globs = ["FormalConjectures.+"]
[lean_lib.leanOptions]
# Upstream's statements carry `sorry` by design -- it is a statement repository.
warn.sorry = false
weak.linter.style.ams_attribute = true
weak.linter.style.category_attribute = true
