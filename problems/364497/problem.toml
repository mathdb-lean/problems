prose = "For k<d and k+1 finite point sets P_i in R^d of cardinality (r_i-1)(d-k+1)+1 with r_i positive, there is a common affine k-flat meeting the convex hull of every part of a partition of each P_i into r_i parts."
notes = "Sadovek and Soberon, Complex analogues of the Tverberg-Vrecica conjecture and central transversal theorems, arXiv:2408.14337v2, Conjecture 1.7 (the real conjecture). https://arxiv.org/html/2408.14337v2 A label function on each finite point set specifies its partition. The fibers are disjoint and cover the point set; the required convex-hull intersections force every part to be nonempty. Labels outside P_i have no effect and can be extended arbitrarily because r_i is positive. One shared affine subspace is chosen for all partitions. Its dimension is the dimension of its direction subspace. The parameters range over all positive r_i, without prime-power restrictions. MathDB: https://mathdb.com/p/364497/tverberg-vrecica-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

