prose = "WOWII [Conjecture 16](http://cms.dt.uh.edu/faculty/delavinae/research/wowII/) For a simple connected graph `G`, the size `b(G)` of a largest induced bipartite subgraph satisfies `b(G) ≥ 2 * (rad(G) - 1) + max_{v ∈ V} l(v)`, where `rad(G)` is the radius of `G` (the minimum eccentricity) and `l(v) = indepNeighborsCard G v` is the independence number of the neighbourhood of `v`."
