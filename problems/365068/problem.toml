prose = "Every subset of the real line that has an affine copy with nonzero scale in every set with null complement is countable."
notes = "Jung and Lai, arXiv:2410.01275v2, Definition 4.1 and Conjecture 4.2. https://arxiv.org/html/2410.01275v2 Full measure means a null complement, not infinite measure. A set with null complement is Lebesgue measurable in the completion, so no Borel restriction is imposed. The scale may be negative but may not be zero. X has no measurability assumption. The source discusses set-theoretic independence; this is a statement, not a claimed theorem of Lean. MathDB: https://mathdb.com/p/365068/full-measure-universality-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

