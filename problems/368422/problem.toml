prose = "There is an absolute positive constant C such that in every dimension d >= 1 every finite zero-sum family of vectors in the Euclidean unit ball can be reordered so that all partial sums have norm at most C times sqrt(d)."
notes = "Ambrus and Heck, A note on the Steinitz Lemma, arXiv:2505.09465v3, Conjecture 5 and the definitions preceding it. https://arxiv.org/html/2505.09465v3 The absolute constant is chosen before the dimension and the vector family. Finite indexed families permit repeated vectors, as in the primary source. A permutation reorders the entire family, and every partial sum is checked. MathDB says this was refuted, but the cited source says it has refuted all attempts, meaning attempts to solve it. The source still presents Conjecture 5 as open; this contribution follows that source rather than the erroneous status sentence. MathDB: https://mathdb.com/p/368422/bergstrom-s-conjecture-on-the-euclidean-steinitz-constant. MathDB row and statement UUIDs await maintainer assignment/confirmation."

