prose = "WOWII [Conjecture 58](http://cms.dt.uh.edu/faculty/delavinae/research/wowII/) For a connected graph `G`, the size `f(G)` of a largest induced forest satisfies `f(G) ≥ ceil( b(G) / average l(v) )` where `b(G)` is the largest induced bipartite subgraph and `l(v)` is the independence number of `G.neighborSet v`. This conjecture is false. A counterexample is the graph described in the module docstring above: a $K_{3,3}$ joined to a $K_{73}$ via vertex $0$, giving $\\lceil b/l_{\\mathrm{avg}} \\rceil \\ge 7 > 6 \\ge f(G)$. The counterexample has been found by Moritz Firsching and Goran Žužić using an experimental pipeline."
notes = "Written on the Wall II, problem GraphConjecture58"

