prose = "Question 1: Is it true that $\\limsup_{k \\to \\infty} A_k = \\infty$? Erdős [Er64b] remarks it is \"easy to see\" that $\\limsup_k \\sup_n |\\sum_{j \\le n} e(k x_j)| = \\infty$. Erdős [Er65b] later found a \"very easy\" proof that $A_k \\gg \\log k$ for infinitely many $k$. Clunie [Cl67] proved that $A_k \\gg k^{1/2}$ for infinitely many $k$, which implies the answer is yes (Tao independently found a proof). This is Problem 7.21 in [Ha74]."
notes = "Erdos Problem 987 -- https://www.erdosproblems.com/987"

