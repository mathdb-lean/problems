prose = "Conjecture: unless $n! + 1$ is prime (i.e., $n \\in \\text{A002981}$), $a(n) = p q$ where $p$ is the least prime $> \\sqrt{n!}$ such that $(p - 1) \\mid n!$ and $q = \\frac{n!}{p - 1} + 1$ is prime. - M. F. Hasler, Oct 04 2009 The conclusion $(p(n)).\\text{Prime}$ asserts that such a prime $p$ exists: if no prime satisfies the search conditions then `p n` is `sInf ∅ = 0`, which is not prime."
