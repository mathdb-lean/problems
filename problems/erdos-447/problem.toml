prose = "How large can a union-free collection $\\mathcal{F}$ of subsets of $[n]$ be? By union-free we mean there are no solutions to $A\\cup B=C$ with distinct $A,B,C\\in \\mathcal{F}$. Must $\\lvert \\mathcal{F}\\rvert =o(2^n)$? In [Er65b] Erdős reported that the estimate $\\lvert \\mathcal{F}\\rvert=o(2^n)$ was proved in unpublished work by Sárközy and Szemerédi."
