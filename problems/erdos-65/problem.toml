prose = "Let $G$ be a graph with $n$ vertices and $kn$ edges, and $a_1<a_2<\\cdots$ be the lengths of cycles in $G$. Assume $n>0$ and $k>0$. Is it true that $$\\sum\\frac{1}{a_i}\\gg \\log k?$$ Gyárfás, Komlós, and Szemerédi [GKS84] have proved that this sum is $\\gg \\log k$, so that only the second question remains."
