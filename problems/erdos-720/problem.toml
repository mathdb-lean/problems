prose = "Let $\\hat{R}(G)$ denote the size Ramsey number, the minimal number of edges $m$ such that there is a graph $H$ with $m$ edges such that in any $2$-colouring of the edges of $H$ there is a monochromatic copy of $G$. Is it true that, if $P_n$ is the path of length $n$, then $\\hat{R}(P_n)/n\\to \\infty$? The answer is no: Beck [Be83b] proved that in fact $\\hat{R}(P_n)\\ll n$."
notes = "Erdos Problem 720 -- https://www.erdosproblems.com/720"

