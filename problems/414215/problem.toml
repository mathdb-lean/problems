prose = "Every continuous real function on the boundary of an origin-symmetric convex body can be uniformly approximated by sums of two homogeneous polynomials of consecutive degrees n and n+1, with arbitrarily small error for every sufficiently large n."
notes = "Kroo, Homogeneous polynomial approximation on convex and star like domains, Dolomites Research Notes on Approximation 16 (2023), Section 5, Problem 1. https://drna.padovauniversitypress.it/system/files/papers/KrooSurvey2023.pdf The function is defined only on the boundary, via a ContinuousMap from its subtype. The epsilon formulation requires an approximating pair for every sufficiently large degree, not just some arbitrarily large degrees. Mathlib IsHomogeneous permits the zero polynomial, as does the homogeneous polynomial vector space in the source. Polynomial evaluation uses the ordinary real coordinates of Euclidean space. MathDB records a recent claimed solution; this is only a formal statement. MathDB: https://mathdb.com/p/414215/kroo-s-homogeneous-polynomial-approximation-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

