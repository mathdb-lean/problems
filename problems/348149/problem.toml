prose = "For positive d, k and m, every family of m finite measures on R^d absolutely continuous with respect to Lebesgue measure admits an equipartition by k affine hyperplanes if and only if m(2^k-1) <= dk."
notes = "Roldan-Pensado and Soberon, A survey of mass partitions, arXiv:2010.00478v3, Problem 2.1.1 and Conjecture 2.1.2. https://arxiv.org/html/2010.00478v3 Each hyperplane has a unit normal and real offset. Boolean sign choices enumerate all 2^k open cells; their boundaries are null for the absolutely continuous measures. Every cell is required to be nonempty, including when all the measures are zero. Each cell must have exactly 1/2^k of each total mass. The measures need not have probability normalization. For positive k, the integer inequality is equivalent to the ceiling bound in the source, with no rounding ambiguity. Hyperplanes are not required to be orthogonal. MathDB: https://mathdb.com/p/348149/ramos-s-grunbaum-hadwiger-ramos-mass-partition-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

