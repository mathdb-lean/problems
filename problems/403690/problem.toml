prose = "Let $1=d_1<\\cdots <d_{\\tau(n)}=n$ be the divisors of $n$ and $$G(n) = \\sum_{1\\leq i<\\tau(n)}\\frac{d_i}{d_{i+1}}.$$ Is it true that $G(n)\\to \\infty$ for almost all $n$? The answer is yes: Tao observed that $\\tau(n/m)/m\\leq G(n)\\leq \\tau(n)$ for any $m\\mid n$ with $m>1$, so that $G(n)$ behaves very similarly to $\\tau(n)$. In [Er82e] Erdős recalls this conjecture and observes that it is indeed trivial that $G(n)\\to \\infty$ for almost all $n$."
notes = "Erdos Problem 673 -- https://www.erdosproblems.com/673"

