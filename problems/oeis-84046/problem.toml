prose = "Conjecture: if a(k) = 0 then k is an even square. This is false for $k = 27$. Every candidate $x^{27} - 27$ factors as $(x^9 - 3)(x^{18} + 3x^9 + 9)$, so $a(27) = 0$, but $27$ is not an even square."
