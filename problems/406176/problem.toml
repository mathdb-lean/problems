prose = "Conjecture I: if $n > 2$, then $\\frac{a(\\text{A005382}(n))}{12}$ is prime, where A005382 is the sequence of primes $p$ such that $2p-1$ is also prime. Since $\\text{A005382}(1) = 2$, $\\text{A005382}(2) = 3$ and $\\text{A005382}(3) = 7$, this says that $\\frac{a(p)}{12}$ is prime for every prime $p > 3$ such that $2p-1$ is also prime. - Lorenzo Sauras Altuzarra, Oct 13 2020"
