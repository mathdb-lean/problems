prose = "Suppose that $A + A$ contains the first $n$ squares. Is $|A| \\geq n^{1 - o(1)}$? It is known that necessarily $|A| \\geq n^{2/3 - o(1)}$, whilst in the other direction there do exist such $A$ with $|A| \\ll_C n / \\log^C n$ for any $C$."
notes = "Green, open problem 61 -- https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf#section.8"

