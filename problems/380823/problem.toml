prose = "If a continuously differentiable self-map of a positive-dimensional real Euclidean space has two distinct fixed points, its Jacobian has a nonzero complex eigenvalue at some point."
notes = "Campbell, Unipotent Jacobian Matrices and Univalent Maps, arXiv:math/9907157v2, Conjecture 6. https://arxiv.org/pdf/math/9907157 The Jacobian is formed by applying the real Frechet derivative to the standard basis vectors. Eigenvalues are complex, even though the map and derivative are real. A root of the characteristic polynomial is exactly a complex eigenvalue. The point witnessing a nonzero eigenvalue need not be a fixed point. ContDiff of order one ensures the derivative is defined at every point, so the fallback value of fderiv outside differentiability is irrelevant. MathDB: https://mathdb.com/p/380823/the-two-fixed-point-jacobian-eigenvalue-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

