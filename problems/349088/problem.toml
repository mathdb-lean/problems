prose = "For multiplicatively independent integer bases p and q at least two, the Hausdorff dimensions of the closures of the two forward multiplication orbits of an irrational point of the circle sum to at least one."
notes = "Adamczewski and Faverjon, Mahler's method in several variables and finite automata, arXiv:2012.08283v1, Appendix A, Conjecture A.1. https://arxiv.org/pdf/2012.08283 UnitAddCircle is R/Z with its quotient metric. The orbit includes the initial point (iterate zero). Taking closure is essential: the orbit itself is countable. Irrationality is imposed on the representative x in [0,1). The pinned dependency defines multiplicative independence by irrationality of log(p)/log(q). Hausdorff dimension on the circle agrees with the interval-representative convention via finitely many local isometries; the possible endpoint difference has dimension zero. MathDB: https://mathdb.com/p/349088/furstenberg-s-dimension-conjecture-for-multiplicatively-inde. MathDB row and statement UUIDs await maintainer assignment/confirmation."

