prose = "The cochromatic number of $G$, denoted by $\\zeta(G)$, is the minimum number of colours needed to colour the vertices of $G$ such that each colour class induces either a complete graph or empty graph. Is it true that if $G$ has no $K_5$ and $\\zeta(G)\\geq 4$ then $\\chi(G) \\leq \\zeta(G)+2$? This has been disproved by Steiner [St24b], who constructed a graph $G$ with $\\omega(G)=4$, $\\zeta(G)=4$, and $\\chi(G)=7$."
