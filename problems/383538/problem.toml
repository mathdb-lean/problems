prose = "In dimension d at least two, a family of n at least d+2 sets has an intersection consisting of exactly two nonempty closed convex components if every subfamily of size 1, 2, 3 or d+1 has such an intersection."
notes = "Menara, A Helly-Type Theorem for two-component convex sets, arXiv:2608.17805v1, Theorem 4.2. https://arxiv.org/html/2608.17805v1 The MathDB question uses the strengthened formulation of Theorem 4.2, not merely nonemptiness of the total intersection. Two disjoint nonempty closed convex pieces are exactly the connected components: convexity makes each connected, and each is relatively clopen in their union. No boundedness or compactness is assumed. The size-one condition includes the hypothesis on each individual set. The 2026 source claims a proof; this file supplies only its statement. MathDB: https://mathdb.com/p/383538/gil-kalai-s-helly-type-question-for-two-component-convex-set. MathDB row and statement UUIDs await maintainer assignment/confirmation."

