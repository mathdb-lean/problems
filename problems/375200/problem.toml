prose = "The general Dyn-Farkhi assertion is false: there are nonempty compact sets A and B in some positive-dimensional Euclidean space for which the squared Hausdorff distance of A+B from its convex hull exceeds the sum of the corresponding squared distances for A and B."
notes = "Van Hintum, arXiv:2606.10815v1, introduction and Conjecture 1.1 (historical assertion). The introduction records the disproof in dimensions at least 3 by Fradelizi, Madiman, Marsiglietti and Zvavitch. https://arxiv.org/html/2606.10815v1 The original universal assertion is recorded separately as Conjecture. Target asks for its negation because the statement is disproved in the literature. For a nonempty compact set, its convex hull is compact in finite-dimensional Euclidean space. Since the set is contained in its convex hull, the symmetric Hausdorff distance is exactly the one-sided sup-inf quantity used in the source. All distances are Euclidean. MathDB: https://mathdb.com/p/375200/dyn-farkhi-conjecture-on-hausdorff-convexification-under-min. MathDB row and statement UUIDs await maintainer assignment/confirmation."

