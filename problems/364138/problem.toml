prose = "For 3 <= d <= 41 and N > 1, the convex hull of a totally separable packing of N unit balls has volume at least that of N consecutively tangent collinear unit balls."
notes = "Bezdek and Langi, On separability in discrete geometry, arXiv:2407.20169v2, Definition 14 and Conjecture 3. https://arxiv.org/html/2407.20169v2 For every ordered pair of distinct balls, a unit normal and offset specify a separating hyperplane avoiding the interior of every ball. The unit-normal inequalities express distances at least one from this hyperplane, allowing tangency. They also force distinct centers and non-overlapping interiors. The comparison packing has centers 2*i*u for a unit vector u, so adjacent balls touch and the center segment has length 2(N-1). Quantifying all unit vectors avoids selecting a coordinate axis and gives the same comparison volume by rotation invariance. MathDB: https://mathdb.com/p/364138/fejes-toth-s-sausage-conjecture-for-ts-packings-of-unit-ball. MathDB row and statement UUIDs await maintainer assignment/confirmation."

