prose = "Is it true that $\\limsup M_n = \\infty$? This is Problem 4.1 in [Ha74] where it is attributed to Erdős. The weaker conjecture that $\\limsup M_n=\\infty$ was proved by Wagner [Wa80], who show that there is some $c>0$ with $M_n>(\\log n)^c$ infinitely often."
