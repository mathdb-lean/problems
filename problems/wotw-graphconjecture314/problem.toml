prose = "WOWII [Conjecture 314](http://cms.uhd.edu/faculty/delavinae/research/wowII/all.html#conj314): For every finite simple connected graph $G$ with $n > 1$ vertices, if $G$ is triangle-free and $\\mathrm{path}(G) \\le 4$, then $G$ is well totally dominated. Here $\\mathrm{path}(G) = \\mathrm{largestInducedPathSize}\\, G$ is the **size of a largest induced path** in $G$, defined locally above. **Disambiguation.** Earlier revisions of this file used the `SimpleGraph.path` invariant, but that is the *floor of the average distance*, not the size of a largest induced path — a different quantity that makes Conjecture 314 vacuous in many cases. **Proof summary.** In a connected, $K_{3}$-free, induced-$P_{5}$-free graph $G$: 1. No minimal total dominating set has fewer than two vertices. 2. No minimal total dominating set has more than three vertices. 3. Minimal total dominating sets of sizes two and three cannot coexist. Thus, each minimal total dominating set in $G$ has the same size. The Lean proof was generated by OpenAI GPT-5.6 Sol."
notes = "Written on the Wall II, problem GraphConjecture314"

