prose = "Let $k\\geq 3$. Is it true that, in any finite colouring of the integers, there are monochromatic arithmetic progressions of primes of length $k$? It follows from the theorem of Green and Tao [GrTa08] (that any set of primes with positive relative density contains arbitrarily long arithmetic progressions) that the answer to the first question is yes for any $k\\geq 3$. See also [219](https://www.erdosproblems.com/219)."
