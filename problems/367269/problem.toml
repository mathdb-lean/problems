prose = "For every positive integer n and every family L of positive-length line segments in Euclidean n-space, the Hausdorff dimension of the union of the full lines containing the segments equals the Hausdorff dimension of the union of the segments."
notes = "Keleti, Are lines much bigger than line segments?, Conjecture 1.1: https://arxiv.org/abs/1409.5992. Wang and Zahl, Section 1.6, Conjecture 1.13: https://arxiv.org/html/2502.17655v1#S1.SS6. Theorem 1.14 establishes dimension 3; this target includes all positive dimensions. Closed nondegenerate segments are encoded by arbitrary sets of distinct endpoint pairs; no countability or measurability assumption is imposed. MathDB: https://mathdb.com/p/367269/keleti-s-line-segment-extension-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

