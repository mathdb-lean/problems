prose = "\"All denominators are powers of two (A000079).\" - _Robert G. Wilson v_, Aug 02 2015 This is false: for $n = 1807$ the denominator of $1/\\det(M)$ is divisible by $3$. See T. Adamczewski, OEIS Open: How many conjectures can language models turn into theorems?, [arXiv:2608.11941](https://arxiv.org/abs/2608.11941). The Lean disproof there uses the closed form $1/\\det(M) = \\prod_{k=1}^n k^2/\\varphi(k)$ from the OEIS entry: https://github.com/epoch-research/LeanOpenProblems-results/blob/fd09021e79869476ef83cda231312f1a2a89c8d7/runs/oeis-full-50usd-ant-j0j0g4uzligm1k41/oeis_60841_conjecture_0/Submission/Spec.lean#L272"
