prose = "For each integer n at least 3 there is a positive epsilon such that every Borel subset A of the real line of Hausdorff dimension greater than 2/n - epsilon admits n real shifts whose setwise product contains a nonempty open interval."
notes = "Hong, Liang and Shen, arXiv:2607.00372v1, Conjecture 1.7. https://arxiv.org/html/2607.00372v1 The epsilon depends only on n, and is chosen before A. MeasurableSet on the real line means Borel. All factors may choose their points of A independently. Hausdorff dimension of a subset of the real line is finite, so toReal is its ordinary real-valued dimension; it does not discard infinity here. MathDB: https://mathdb.com/p/375707/the-shifted-product-nonempty-interior-conjecture-for-product. MathDB row and statement UUIDs await maintainer assignment/confirmation."

