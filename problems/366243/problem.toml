prose = "A real set is full-measure universal exactly when it is strongly meager; moreover, no nonempty perfect real set is full-measure universal."
notes = "Jung, Lai and Mooroogen, Fifty years of the Erdos similarity conjecture, arXiv:2412.11062v2, Conjecture 4.3(1)-(2). https://arxiv.org/html/2412.11062v2 Both assertions on the MathDB page are included as a conjunction. Null sets and full-measure sets need not be Borel. Affine scale is nonzero. Nonemptiness of the perfect set is an explicit interpretation of the source: the empty set is Perfect in Mathlib and is trivially full-measure universal, so the non-universality assertion cannot include it. The source does not explicitly state this convention. No countability or measurability assumption is imposed on the arbitrary set X. MathDB: https://mathdb.com/p/366243/the-full-measure-universality-and-strongly-meager-sets-conje. MathDB row and statement UUIDs await maintainer assignment/confirmation."

