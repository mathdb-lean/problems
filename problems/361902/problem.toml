prose = "A positive log-convex function h on (0,infinity) is integrable there if h(n)/h(n+1) tends to one and h(x)^2/h(2x) is integrable there."
notes = "Brian Simanek, On Some Convexity Questions of Handelman, arXiv:2402.10970v1, Conjecture 1 and Theorem 2. https://arxiv.org/pdf/2402.10970v1 Positivity and log-convexity are imposed only on the positive half-line. Values of the total Lean function outside that domain are irrelevant. The natural-number ratio sequence starts at n+1, avoiding the excluded endpoint zero; a finite index shift does not change the limit. IntegrableOn is Lebesgue integrability. The primary paper proves this conjecture as Theorem 2; its negative result concerns a different, converse question. MathDB: https://mathdb.com/p/361902/handelman-s-integrability-conjecture-for-log-convex-function. MathDB row and statement UUIDs await maintainer assignment/confirmation."

