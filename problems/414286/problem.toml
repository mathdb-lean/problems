prose = "Every finite covering of the unit square minus its concentric closed square of side one half by Euclidean planks has total width at least one."
notes = "Bakaev and Polyanskii, A sharp plank theorem for cube annuli, arXiv:2611.00379v1, introduction and Theorem 1. https://arxiv.org/html/2611.00379v1 This states the concentric square formulation on MathDB; the cited paper treats more general hole locations. A plank is a closed strip with a unit normal and distinct boundary levels, so its width is exactly b-a. The hole is closed as written on MathDB. For finite unions of closed planks, including or excluding the inner boundary gives equivalent covering assertions by taking closure. A recent preprint claims a proof; no Lean proof or independent verification is claimed here. MathDB: https://mathdb.com/p/414286/bezdek-s-plank-covering-conjecture-for-square-annuli. MathDB row and statement UUIDs await maintainer assignment/confirmation."

