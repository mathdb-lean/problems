prose = "For an analytic one-parameter family of linear maps from R^n to R^m, n >= m, if each linear subspace has maximal possible image dimension except at finitely many parameters in [0,1], every Borel set has maximal possible Hausdorff image dimension for almost every parameter in [0,1]."
notes = "Jiahan Du, Restricted Marstrand projection theorem for general families of linear subspaces, arXiv:2510.16671v2, Conjecture 1.5. https://arxiv.org/html/2510.16671v2 AnalyticOnNhd on the compact parameter interval expresses real analyticity near each parameter, equivalent to coordinatewise analyticity in these finite-dimensional spaces. The finite exceptional set may depend on the subspace; the null exceptional set may depend on the Borel set. The maps are arbitrary linear maps, not assumed orthogonal projections. ContinuousLinearMap imposes no extra restriction in finite dimensions. MathDB: https://mathdb.com/p/371029/restricted-marstrand-projection-conjecture-for-analytic-fami. MathDB row and statement UUIDs await maintainer assignment/confirmation."

