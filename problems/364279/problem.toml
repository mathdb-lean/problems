prose = "Every planar convex body of area one can be partitioned by two perpendicular lines into four cyclically ordered pieces of areas t, t, 1/2-t and 1/2-t, for any t in [0,1/4]."
notes = "McGinnis and Zerbib, Using the KKM theorem, arXiv:2408.03921v1, Conjecture 4.2. https://arxiv.org/html/2408.03921v1 A convex body is represented by a compact convex set with nonempty interior. The lines pass through a common point and have unit orthogonal normals. The sign pairs (+,+),(-,+),(-,-),(+,-) give a cyclic order. Reversing its orientation does not change the existence statement for the pattern (t,t,s,s), since the reverse pattern is a cyclic rotation. Open quadrants omit only boundary lines of area zero. Both t=0 and t=1/4 are included. This is a positive assertion for uniform area on convex bodies, distinct from the counterexample question for arbitrary absolutely continuous measures. MathDB: https://mathdb.com/p/364279/grunbaum-s-orthogonal-line-equipartition-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

