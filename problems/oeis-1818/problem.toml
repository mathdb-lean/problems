prose = "Conjecture 2: Let $p$ be an odd prime. Then the permanent of the $(p-1) \\times (p-1)$ matrix $[f(j,k)]_{j,k=1..p-1}$ is congruent to $a((p-1)/2) = ((p-2)!!)^2 \\pmod{p^2}$, where $f(j,k)$ is $(j+k)/(j-k)$ if $j \\neq k$, and $f(j,k) = 1$ otherwise. - Zhi-Wei Sun, Dec 22 2021"
