prose = "WOWII [Conjecture 200](http://cms.dt.uh.edu/faculty/delavinae/research/wowII/) For a simple connected graph `G`, if `tree(G) = ⌈1 + l_avg(G)⌉`, then `G` has a Hamiltonian path. Here `tree(G)` is the number of vertices of a largest induced tree subgraph, and `l_avg(G) = averageIndepNeighbors G` is the average over all vertices of the independence number of the neighbourhood. A Hamiltonian path is a walk visiting every vertex exactly once. This conjecture is false. The counterexample family in the module docstring satisfies the equality hypothesis and has no Hamiltonian path."
notes = "Written on the Wall II, problem GraphConjecture200"

