prose = "For every positive-dimensional convex body K and total width W > 0, a single plank of width W covers at least as much of K as any finite family of planks whose widths sum to W."
notes = "Bakaev and Polyanskii, Optimal partial plank coverings, arXiv:2607.27483v1, Conjecture 1. https://arxiv.org/html/2607.27483v1 The optimal single plank is chosen before the competing finite family and depends only on K and W. The source defines a convex body as compact and convex with nonempty interior. Unit normals make b-a the Euclidean width. Competing widths are strictly positive and sum exactly to W. Closed planks cause no boundary ambiguity for Lebesgue volume. The paper proves the ball and planar cases; this target includes all positive dimensions. MathDB: https://mathdb.com/p/376378/the-optimal-partial-plank-covering-conjecture-for-convex-bod. MathDB row and statement UUIDs await maintainer assignment/confirmation."

