prose = "Are there infinitely many positive integers $n$ such that there exist some $t \\ge 2$ and distinct integers $a_1, \\ldots, a_t \\ge 1$ satisfying $$\\frac{n}{2^n} = \\sum_{1 \\le k \\le t} \\frac{a_k}{2^{a_k}}?$$ In [Er88c], Erdős notes that Cusick had a simple proof that infinitely many such $n$ exist."
