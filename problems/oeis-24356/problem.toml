prose = "\"I conjecture that $a(4)$ is the only zero. - _Jon Perry_, Mar 22 2004\" Stated as a biconditional: the claim that $a(4)$ is *the only* zero asserts both that $a(4) = 0$ and that no other index vanishes. A bare implication `a n = 0 → n = 4` would be satisfied vacuously by a sequence with no zero at all. The existence direction is certified by `a_4`; the uniqueness direction is the open part."
