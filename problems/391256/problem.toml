prose = "Let $k\\geq 1$ and $H_k(n)$ be the maximal $r$ such that if $A\\subset\\mathbb{N}$ has $\\lvert A\\rvert=n$ and $\\| 1_A\\ast 1_A\\|_\\infty \\leq k$ then $A$ contains a Sidon set of size at least $r$. Is it true that $H_k(n)/n^{1/2}\\to \\infty$? The answer is yes, and in fact $H_k(n) \\gg_k n^{2/3}$, proved by Alon and Erdős [AlEr85]."
notes = "Erdos Problem 772 -- https://www.erdosproblems.com/772"

