prose = "Any three nonempty compact metric spaces have isometric embeddings into one compact metric space such that all pairwise Hausdorff distances of the images equal the corresponding Gromov-Hausdorff distances."
notes = "Memoli and Wan, Characterization of Gromov-type geodesics, arXiv:2105.05369v2, Section 6, Conjecture 2. https://arxiv.org/html/2105.05369v2 The same ambient space and the same three embeddings must realize all pairs simultaneously. Nonempty is explicit, as in the Hausdorff-distance convention of Definition 2.7 and in Mathlib ghDist. Isometry implies injectivity for metric spaces. The target is a closed proposition: all spaces and instances are quantified inside it. Using Type introduces no restriction on compact metric spaces up to isometry, since such spaces admit small representatives. MathDB: https://mathdb.com/p/350674/three-space-common-ambient-realization-conjecture-for-gromov. MathDB row and statement UUIDs await maintainer assignment/confirmation."

