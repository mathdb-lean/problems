problem_id = "openai-math:296"
collection = "openai-math"
tasks = 2
reviewed_by_a_person = false
prose = "Proves that every type II1 factor with separable predual is generated by a single operator, equivalently by two self-adjoint operators, resolving the generator problem. More strongly, for every irreducible inclusion $`P\\subset M`$ of such factors, the unitaries u with $`M=W^*(P,u)`$ form a dense Gδ subset in the trace 2-norm topology. ([Lean](lean/docs/296.md)) We prove that every type II1 factor with separable predual is generated by one operator, equivalently by two self-adjoint operators. Combined with the established direct-integral reduction to this case, this gives an affirmative solution of the generator problem for von Neumann algebras with separable predual."
notes = "OpenAI math result family 296, The generator problem for finite factors -- https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/docs/296.md"

