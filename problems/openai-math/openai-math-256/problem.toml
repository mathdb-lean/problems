problem_id = "openai-math:256"
collection = "openai-math"
tasks = 1
reviewed_by_a_person = false
prose = "Proves that every finite system of equations over an arbitrary group whose exponent-sum matrix has full row rank over ℚ has a simultaneous solution in an overgroup, resolving Howie's conjecture. The coefficient group embeds in the presented quotient. A companion proves Kervaire's conjecture: adjoining one generator and one relation cannot trivialize a nontrivial group. ([Lean](lean/docs/256.md)) We prove that no free product of a nontrivial group with an infinite cyclic group is normally generated by one element. This resolves the Kervaire conjecture positively."
notes = "OpenAI math result family 256, Nonsingular systems of equations over arbitrary groups -- https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/docs/256.md"

