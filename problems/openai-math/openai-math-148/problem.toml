problem_id = "openai-math:148"
collection = "openai-math"
tasks = 2
reviewed_by_a_person = false
prose = "For every self-similar measure on the line generated by finitely many contracting similarities, proves $`\\dim_{\\mathrm H}\\mu=\\min\\{1,h_{\\mathrm{RW}}/\\chi\\}`$, where $`h_{\\mathrm{RW}}`$ is the entropy rate of random composed maps and χ the average logarithmic contraction. This resolves the entropy-rate dimension conjecture without a separation assumption, allowing exact overlaps and unequal contraction ratios. ([Lean](lean/docs/148.md)) We prove that the Hausdorff dimension of every finite real self-similar measure equals the minimum of one and its random-walk entropy rate divided by its Lyapunov exponent. Exact overlaps are allowed, and the contraction ratios may be unequal and negative. This resolves the entropy-rate dimension conjecture."
notes = "OpenAI math result family 148, The entropy-rate dimension formula for self-similar measures -- https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/docs/148.md"

