problem_id = "openai-math:039"
collection = "openai-math"
tasks = 1
reviewed_by_a_person = false
prose = "Proves Nagata's strict inequality $`\\sum_i m_i\\lt d\\sqrt r`$ for every nonzero effective plane curve of degree d through r ≥ 10 very general complex points, with arbitrary multiplicities mi. It also proves maximal multipoint Seshadri constants $`(L^n/r)^{1/n}`$ for every smooth polarized projective variety of dimension n ≥ 2 and all sufficiently large r: at very general points over ℂ, and at the geometric generic tuple over any algebraically closed field of positive characteristic. ([Lean](lean/docs/039.md)) We prove that a nonzero effective plane curve of degree d at r ≥ 10 very general complex points has total multiplicity strictly less than $`d\\sqrt r`$. The inequality holds simultaneously for all curves, including reducible and nonreduced curves, and establishes Nagata's conjecture in its strict, nonhomogeneous form. We prove that, for every smooth integral complex projective surface S and every ample line bundle L, the multipoint Seshadri constant at r very general points equals $`\\sqrt{L^2/r}`$ for every sufficiently large integer r. This resolves positively the qualitative Nagata–Biran conjecture for surfaces."
notes = "OpenAI math result family 039, Nagata’s conjecture and maximal Seshadri constants -- https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/docs/039.md"

