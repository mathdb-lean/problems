reviewed_by_a_person = false
prose = "Proves the sharp enclosing-area spacetime Penrose inequality for smooth one-ended asymptotically flat initial data in every spatial dimension n ≥ 3, under dominant energy, weak future trapping, positive enclosing area, and the stated decay assumptions. It bounds invariant ADM mass below using minimum enclosing area, with equality rigidity under additional horizon hypotheses. Charged upper-area bounds treat dyonic three-dimensional data; the higher-dimensional purely electric extension uses the matched neutral theorem. ([Lean](lean/docs/260.md)) We replace a three-dimensional Cha–Khuri–Sakovich hyperboloidal end by an asymptotically flat end while preserving the dominant energy condition and each fixed compact interior. For strictly future-timelike CKS initial-data charge, the replacements lose asymptotically no enclosing area and their ADM masses tend to the invariant Bondi mass. Combining this construction with the companion numerical spacetime Penrose theorem yields the sharp Bondi bound for possibly disconnected weakly future trapped boundaries in this class. Horizon-regular Schwarzschild exteriors attain equality at every positive mass."
notes = "OpenAI math result family 260, Spacetime Penrose inequalities: enclosing area, charge, rotation, and anti-de Sitter extensions -- https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/docs/260.md"

