problem_id = "openai-math:292"
collection = "openai-math"
tasks = 1
reviewed_by_a_person = false
prose = "Constructs an explicit separable unital full group C∗-algebra that cannot embed unitally into the norm ultrapower of any fixed nonzero unital nuclear C∗-algebra, for any free ultrafilter on the natural numbers. Taking the target to be $`\\mathcal O_2`$ answers Kirchberg's norm-ultrapower embedding problem negatively. ([Lean](lean/docs/292.md)) We give a negative answer to Kirchberg's norm-ultrapower embedding problem. We construct an explicit separable unital full group C∗-algebra that admits no unital embedding into Bω, for any nonzero unital nuclear C∗-algebra B and any free ultrafilter ω on ℕ. In particular, it does not embed unitally into $`\\mathcal O_2^\\omega`$."
notes = "OpenAI math result family 292, Kirchberg's $`\\mathcal O_2`$ norm-ultrapower embedding problem -- https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/docs/292.md"

