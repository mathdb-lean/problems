problem_id = "openai-math:207"
collection = "openai-math"
tasks = 2
reviewed_by_a_person = false
prose = "Proves the ℓ1-Bass conjecture for every discrete group: Hattori–Stallings traces of idempotent matrices over $`\\ell^1(G)`$ are supported on finitely many finite-order conjugacy classes. The algebraic companion proves the integral Bass trace conjecture and Kaplansky's idempotent conjecture for torsion-free groups over every commutative unital characteristic-zero domain. ([Lean](lean/docs/207.md)) We prove the complex group-ring Bass trace conjecture for every discrete group: the Hattori–Stallings trace of a finitely generated projective module over its complex group ring is supported on conjugacy classes of finite-order elements. As a consequence, for every torsion-free group G and every commutative unital domain R of characteristic zero, the only idempotents in $`RG`$ are 0 and 1. This proves Kaplansky's idempotent conjecture in characteristic zero."
notes = "OpenAI math result family 207, The ℓ¹-Bass conjecture for all discrete groups -- https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/lean/docs/207.md"

