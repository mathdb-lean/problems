prose = "For f_b(x)=1/(1-bx+x^2), the left Riemann sums are neither nondecreasing nor nonincreasing for 1/2 < b < 1, and are nondecreasing for beta < b <= 2. The right sums are neither nondecreasing nor nonincreasing for 1 < b < 3/2, and are nonincreasing for beta < b < 2, where beta=(3+sqrt(13))/4."
notes = "Ludovick Bouthat, On the monotonicity of left and right Riemann sums, arXiv:2311.01208v2, Conjecture 3.2 and definitions in Section 1.1. https://arxiv.org/html/2311.01208v2 All four assertions in Conjecture 3.2 are included. Lean index n denotes the sum on n+1 equal subintervals, so Monotone and Antitone range over every positive subdivision count. The left sum omits x=1 and includes x=0; the right sum does the reverse. The singular parameter b=2 occurs only in the left-sum assertion, so no evaluation at its pole is used. The source leaves Conjecture 3.2 open except for its left-sum endpoint b=2. MathDB: https://mathdb.com/p/360607/conjecture-on-the-monotonicity-of-riemann-sums-for-reciproca. MathDB row and statement UUIDs await maintainer assignment/confirmation."

