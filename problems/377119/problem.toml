prose = "There exists an absolute real constant c > 0 such that, for every compact set K in the Euclidean plane with Hausdorff dimension at least 1, the distance set {dist(x,y) : x,y in K} has Hausdorff dimension at least 1/2 + c."
notes = "Katz and Tao (2001), Distance Conjecture 1.4, p. 3: https://arxiv.org/abs/math/0101195. Solved in the literature by Bourgain using Katz and Tao; see Keleti and Shmerkin (2019), Section 1.1, equation (1.2): https://doi.org/10.1007/s00039-019-00500-9. MathDB: https://mathdb.com/p/377119/the-distance-set-dimension-improvement-conjecture. MathDB row and statement UUIDs await maintainer assignment/confirmation."

