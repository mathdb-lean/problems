prose = "For any real-valued function on the Euclidean plane, let E be the points where the function is Lipschitz in every direction. The points of E where the function fails to be pointwise Lipschitz relative to E form a Lebesgue null set."
notes = "Hruska, A note on directional Lipschitz continuity in the Euclidean plane, arXiv:2012.00162v2, Conjecture 1, Definition 2, and Theorem 1. https://arxiv.org/html/2012.00162v2 The function is arbitrary: no continuity or measurability is assumed. The directional bound is one-sided in the positive step h and is tested for every unit vector, including its negative. Its constants may depend on both the point and the direction. Relative Lipschitz continuity here is the pointwise bound against the fixed base point, not a two-point Lipschitz bound on a whole neighborhood. At isolated points of E the bound holds automatically. These finite local bounds are equivalent to the finite limsup definitions in the source. Nullity uses Lebesgue outer measure through Mathlib volume, so it does not require assuming E or the exceptional set Borel. The source establishes the conjecture; solved refers to the literature, not a supplied Lean proof. MathDB: https://mathdb.com/p/348867/ash-catoiu-conjecture-on-directional-and-relative-lipschitz. MathDB row and statement UUIDs await maintainer assignment/confirmation."

