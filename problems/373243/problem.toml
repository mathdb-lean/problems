prose = "For origin-symmetric compact convex bodies K and L in positive-dimensional Euclidean space with the origin in their interiors, the Wulff body of the geometric interpolation of their support functions has volume at least vol(K)^t vol(L)^(1-t), for every t in [0,1]."
notes = "Iffland, The local logarithmic Brunn-Minkowski inequality for bodies of revolution, arXiv:2602.17912v1, Conjecture 1.1 and the preceding Wulff-shape definition. https://arxiv.org/html/2602.17912v1 The logarithmic combination is an intersection of supporting halfspaces, not the pointwise product or Minkowski sum of bodies. Unit normals use the Euclidean norm. Support values are finite and positive under the compactness and interior hypotheses. Volume is Mathlib Lebesgue measure in Euclidean space, with real powers in ENNReal; all relevant body volumes are finite. Origin symmetry is expressed pointwise by x in K iff -x in K. MathDB records an unverified 2026 solution claim; this contribution states the conjecture and does not endorse a proof. MathDB: https://mathdb.com/p/373243/the-logarithmic-brunn-minkowski-conjecture-for-origin-symmet. MathDB row and statement UUIDs await maintainer assignment/confirmation."

