prose = "A compact planar set E is contained in a line if a family R of determinant-one linear symmetries preserving E has Hausdorff dimension greater than three halves of the Hausdorff dimension of E."
notes = "Hung, Pham and Slavov, arXiv:2501.01697v2, Conjecture 1.8. https://arxiv.org/html/2501.01697v2 R is an arbitrary set of special-linear matrices; it is not required to be a subgroup. Its dimension is computed after inclusion in the space of real 2-by-2 matrices. The product metric there is bi-Lipschitz equivalent to the Euclidean metric on four entries, giving the same Hausdorff dimension. The conclusion is containment in a full affine line. MathDB: https://mathdb.com/p/366503/hausdorff-dimensional-packing-conjecture-for-special-linear. MathDB row and statement UUIDs await maintainer assignment/confirmation."

