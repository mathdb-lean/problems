prose = "**Conjecture from Creighton Dement (A100434)**: Let the auxiliary sequences c, d, e, f, g, b be defined as specified. Then for all $n \\ge 0$, $g(n) + a(n) = b(n)$. **Proof outline**: strong two-step induction on the paired recurrences. The even/odd cases are coupled through closed identities between consecutive terms of the relevant pair of sequences (here $g, a$), and the induction step is discharged by `rfl`-level unfolding of the definitions plus linear arithmetic. (Numerically verified for $n < 600$ before formalization.)"
notes = "OEIS A100434 -- https://oeis.org/A100434"

