name: Check statements

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify.py

  compile:
    # Every statement module elaborates against the project, split across shards so the
    # 1574 modules finish in well under an hour.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - name: Build the project
        run: |
          lake exe cache get
          lake build MathDBLib FormalConjecturesUtil FormalConjecturesForMathlib
      - name: Compile this shard's statements
        run: |
          find problems -mindepth 2 -maxdepth 2 -name '*.lean' | sort \
            | awk -v n=8 -v s=${{ matrix.shard }} 'NR % n == s' > shard.txt
          echo "$(wc -l < shard.txt) modules"
          failed=0
          while read -r file; do
            if ! lake env lean -DautoImplicit=false -DrelaxedAutoImplicit=false "$file" > out.txt 2>&1; then
              echo "::error file=$file::does not compile"; cat out.txt; failed=$((failed + 1))
            fi
          done < shard.txt
          echo "$failed failed"
          test "$failed" -eq 0
