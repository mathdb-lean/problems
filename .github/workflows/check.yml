name: Check statements

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify.py

  compile:
    # Every statement module elaborates against the project and rests on Lean's own
    # axioms only, split across shards so the modules finish in well under an hour.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - name: Build the project
        run: |
          lake exe cache get
          lake build MathDBLib FormalConjecturesUtil FormalConjecturesForMathlib
      - name: Compile this shard's statements and audit their axioms
        # `lean` exits 0 on a `sorry`, so compiling alone would pass a statement that
        # rests on one; check_statements.py also prints `Problem.Target`'s axioms.
        run: python3 check_statements.py --shard ${{ matrix.shard }}/8
